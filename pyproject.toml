[project]
name = "cad-stainless-quote"
version = "0.1.0"
description = "Traceable stainless-steel CAD quantity takeoff and quotation pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["cad", "dxf", "quantity-takeoff", "quotation", "codex-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
  "ezdxf>=1.4,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "XlsxWriter>=3.2,<4",
  "xlrd>=2.0,<3",
  "rarfile>=4.2,<5",
  "py7zr>=0.22,<1",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.10,<4",
  "rapidfuzz>=3.12,<4",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
